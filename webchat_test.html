<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rasa Assistant — Test Chat</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  .user { background: #DCF8C6; margin-left: auto; text-align: right; }
  .bot { background: #F1F0F0; }
  #row { display: flex; gap: 8px; }
  #input { flex: 1; padding: 8px; }
  #send { padding: 8px 16px; }
  #serverUrl { width: 100%; padding: 6px; margin-bottom: 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Rasa Assistant — Test Chat</h1>
  <input id="serverUrl" value="http://localhost:5005/webhooks/rest/webhook">
  <div id="log"></div>
  <div id="row">
    <input id="input" placeholder="Type a message..." autofocus>
    <button id="send">Send</button>
  </div>

<script>
  const sender = "webchat_" + Math.random().toString(36).slice(2, 8);
  const log = document.getElementById("log");
  const input = document.getElementById("input");

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";

    const url = document.getElementById("serverUrl").value;
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender, message })
      });
      const replies = await res.json();
      replies.forEach(r => { if (r.text) addMessage(r.text, "bot"); });
    } catch (err) {
      addMessage("Error reaching assistant: " + err.message, "bot");
    }
  }

  document.getElementById("send").addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
