name: "final-retrieval-eval-fastembed"
description: "Local retrieval quality eval (fastembed / ONNX embedder)"
task: "retrieval"
dataset_name: "retrieval-eval"
results_dir: "eval_results/final_retrieval_fastembed"
formats:
  - "langfuse"
  - "yaml"
retrieval:
  docs_repo_path: "[PATH_TO_DOCS_REPO]"
  local:
    index_cache_dir: "[PATH_TO_INDEX_CACHE_DIR]"
    embedder:
      embed_engine: "fastembed"
      embed_model: "BAAI/bge-small-en-v1.5"
    top_k: 10
