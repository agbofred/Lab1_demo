schema;assertions:
  extensions:
    - pykwalify_extensions.py
  func: require_assertion_keys
  type: "seq"
  matching: "any"
  sequence:
  - type: map
    mapping:
       flow_started:
         type: any
         nullable: false
       flow_completed:
         type: map
         mapping:
           flow_id:
             type: str
             required: true
           flow_step_id:
             type: str
       flow_cancelled:
         type: map
         mapping:
           flow_id:
             type: str
             required: true
           flow_step_id:
             type: str
       pattern_clarification_contains:
         type: any
         nullable: false
       action_executed:
         type: str
         nullable: false
       slot_was_set:
         type: seq
         matching: "all"
         nullable: false
         sequence:
         - type: map
           mapping:
             name:
               type: str
               required: true
             value:
               type: any
       slot_was_not_set:
         type: seq
         matching: "all"
         nullable: false
         sequence:
         - type: map
           mapping:
             name:
               type: str
               required: true
             value:
               type: any
       bot_uttered:
         type: map
         nullable: false
         mapping:
           utter_name:
             type: str
             nullable: false
           buttons:
             type: seq
             nullable: false
             matching: "all"
             sequence:
             - type: map
               mapping:
                 title:
                   type: str
                   nullable: false
                 payload:
                   type: str
                   nullable: false
           text_matches:
             type: str
             nullable: false
       bot_did_not_utter:
         type: map
         nullable: false
         mapping:
           utter_name:
             type: str
             nullable: false
           buttons:
             type: seq
             nullable: false
             matching: "all"
             sequence:
               - type: map
                 mapping:
                   title:
                     type: str
                     nullable: false
                   payload:
                     type: str
                     nullable: false
           text_matches:
             type: str
             nullable: false
       generative_response_is_relevant:
         type: map
         mapping:
           threshold:
             type: float
             required: true
           utter_name:
             type: str
             nullable: false
           utter_source:
             type: str
             nullable: false
       generative_response_is_grounded:
         type: map
         mapping:
           threshold:
             type: float
             required: true
           utter_name:
             type: str
             nullable: false
           ground_truth:
             type: str
             nullable: false
           utter_source:
             type: str
             nullable: false
       skill_activated:
         type: map
         mapping:
           skill_id: {type: str, required: true}
       skill_completed:
         type: map
         mapping:
           skill_id: {type: str, required: true}
       skill_cancelled:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           step_id: {type: str}
       skill_interrupted:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           step_id: {type: str}
       skill_resumed:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           step_id: {type: str}
       memory_was_set:
         type: seq
         sequence:
           - type: map
             mapping:
               name: {type: str, required: true}
               value: {type: any, nullable: false}
       memory_was_not_set:
         type: seq
         sequence:
           - type: map
             mapping:
               name: {type: str, required: true}
               value: {type: any, nullable: false}
       memory_was_cleared:
         type: seq
         sequence:
           - type: map
             mapping:
               name: {type: str, required: true}
       ordered_block_entered:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           block_id: {type: str, required: true}
       ordered_block_completed:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           block_id: {type: str, required: true}
           step_id: {type: str}
       ordered_block_cancelled:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           block_id: {type: str, required: true}
           step_id: {type: str}
       ordered_block_interrupted:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           block_id: {type: str, required: true}
           step_id: {type: str}
       ordered_block_resumed:
         type: map
         mapping:
           skill_id: {type: str, required: true}
           block_id: {type: str, required: true}
           step_id: {type: str}
       tool_executed:
         type: map
         mapping:
           tool_name: {type: str, required: true}
           source: {type: str, required: true, enum: [local, mcp]}
           mcp_server: {type: str}
           skill_id: {type: str}
           arguments:
             type: map
             allowempty: true
             matching: any
             mapping:
               regex;(.+):
                 type: any
           is_error: {type: bool}
       tools_within_one_turn:
         type: map
         mapping:
           ordered: {type: bool}
           allow_extra_calls: {type: bool, required: true}
           calls:
             type: seq
             required: true
             range: {min: 2}
             sequence:
               - type: map
                 matching: any
                 range: {min: 1, max: 1}
                 mapping:
                   tool_executed:
                     type: map
                     required: true
                     mapping:
                       tool_name: {type: str, required: true}
                       source: {type: str, required: true, enum: [local, mcp]}
                       mcp_server: {type: str}
                       skill_id: {type: str}
                       arguments:
                         type: map
                         allowempty: true
                         matching: any
                         mapping:
                           regex;(.+):
                             type: any
                       is_error: {type: bool}

