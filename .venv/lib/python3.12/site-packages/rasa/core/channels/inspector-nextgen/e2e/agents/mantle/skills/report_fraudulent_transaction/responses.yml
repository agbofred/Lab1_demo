responses:
  utter_show_recent_charges:
    - text: "{session.report_fraudulent_transaction.recent_transactions_text}"
  utter_ask_fraudulent_charges:
    - text: |
        Which charges are fraudulent? Please name the merchant or describe the
        charge from the list above.

  utter_confirm_fraud_report:
    - text: |
        Here is a summary of the fraudulent charges you reported:
        Card: {session.card_disambiguation.selected_card_label}
        {session.report_fraudulent_transaction.fraud_report_summary_text}
        Shall I file this fraud report? Please say yes to file it or no to cancel.

  utter_fraud_report_cancelled:
    - text: |
        Okay, I will not file the fraud report. Let me know if you want to continue
        or report different charges.

  utter_no_charges_to_report:
    - text: There are no recent charges to report on this card.
  utter_fraud_report_filed:
    - text: |
        Your fraudulent transaction report has been filed. Would you like to order
        a replacement card? The card may have been stolen.
