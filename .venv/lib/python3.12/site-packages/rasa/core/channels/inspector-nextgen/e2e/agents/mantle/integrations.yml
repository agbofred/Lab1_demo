model_groups:
  - id: main_model
    models:
      - provider: openai
        model: gpt-5.1-2025-11-13
        api_base: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY}

# Input channels for the assistant. In CALM v2, channels are declared here
# rather than in credentials.yml. Required by the simulation/evaluation
# framework:
#   rest:      REST input channel used by talk_to_assistant / evaluate_agent
#   inspector: needed when starting the server with --inspect (Inspector URLs)
channels:
  rest: { enabled: true }
  inspector: { enabled: true }

# Langfuse tracing (disabled by default).
#
# Each user turn becomes one Langfuse trace, with a nested span per LLM call
# (main orchestrator iterations + rephrase) and per-turn grouping by sender id.
#
# To enable: install the monitoring extra (`pip install rasa-pro[monitoring]`),
# set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY, and uncomment the block below.
# public_key / private_key must use ${VAR} syntax. They stay as literals when
# integrations.yml is parsed and are resolved when Langfuse configures at startup;
# unset variables do not fail YAML load. Run `rasa data validate` to check shape
# and key syntax before deploy.
#
#tracing:
#  type: langfuse
#  public_key: ${LANGFUSE_PUBLIC_KEY}
#  private_key: ${LANGFUSE_SECRET_KEY}
#  host: https://cloud.langfuse.com
