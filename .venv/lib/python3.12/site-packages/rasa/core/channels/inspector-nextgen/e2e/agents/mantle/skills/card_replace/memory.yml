schema:
  public:
    account_replace_eligible:
      type: bool
    replacement_reason:
      type: categorical
      enum_values: [lost, stolen, damaged, not_received]
      llm_settable: true
      description: Why the card is being replaced — lost, stolen, damaged, or not received.
    replace_target:
      type: categorical
      enum_values: [customer, authorized_user, both]
    damage_processed:
      type: bool
    has_authorized_user:
      type: bool
    all_charges_familiar:
      type: bool
      llm_settable: true
      description: Whether the customer recognizes the recent charges on the card.
    transaction_review_complete:
      type: bool
    recent_transactions:
      type: json
    recent_transactions_card_id:
      type: text
    recent_transactions_card_label:
      type: text
    recent_transactions_text:
      type: text
    transaction_available:
      type: bool
    wants_lock:
      type: bool
      llm_settable: true
      description: Whether the customer wants the card locked before a replacement is ordered.
    card_locked_this_flow:
      type: bool
    lock_declined:
      type: bool
    digital_wallet_eligible:
      type: bool
    card_already_provisioned:
      type: bool
    accept:
      type: bool
      llm_settable: true
      description: Whether the customer agrees to add the card to a digital wallet.
    wallet_declined:
      type: bool
    selected_wallet_provider:
      type: text
      llm_settable: true
      description: Which digital wallet the customer wants the card added to.
    digital_wallet_provisioned:
      type: bool
    rush_eligible:
      type: bool
    shipping_type:
      type: categorical
      enum_values: [rush, standard]
      llm_settable: true
      description: How the replacement card should be shipped — rush or standard.
    order_confirmed:
      type: bool
    replacement_submitted:
      type: bool
    order_shipping_summary:
      type: text
