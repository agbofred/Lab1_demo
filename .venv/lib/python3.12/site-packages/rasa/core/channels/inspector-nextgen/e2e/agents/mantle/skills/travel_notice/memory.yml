schema:
  public:
    destination:
      type: text
      llm_settable: true
      description: Where the customer is traveling.
    travel_dates:
      type: text
      llm_settable: true
      description: When the customer will be away.
    destination_high_risk:
      type: bool
    risk_checked:
      type: bool
    notice_confirmed:
      type: bool
      llm_settable: true
      description: Whether the customer confirmed the travel notice before it is submitted.
    notice_submitted:
      type: bool
