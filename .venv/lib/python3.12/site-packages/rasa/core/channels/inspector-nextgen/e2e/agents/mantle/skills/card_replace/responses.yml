responses:
  utter_account_not_eligible:
    - text: |
        Your account is not eligible for self-service card replacement right now.
        Please contact customer support for help.

  utter_card_not_eligible:
    - text: |
        This card cannot be replaced through self-service. Please contact customer
        support for help.

  utter_ask_reason_for_replacement:
    - text: |
        What happened to the card? Please say lost, stolen, damaged, or not received.

  utter_ask_reason_after_fraud:
    - text: |
        You already filed a fraud report on this card:
        {session.report_fraudulent_transaction.fraud_report_summary_text}
        For the replacement, should we treat it as stolen, or did something else
        happen — lost, damaged, or not received?

  utter_ask_replace_target:
    - text: |
        Who needs the replacement card — your card only, the authorized user's card,
        or both?

  utter_stolen_lock_notice:
    - text: |
        Since this card was reported stolen, I will lock it now to protect your account.

  utter_ask_transaction_review:
    - text: |
        Here are your recent charges:
        {session.card_replace.recent_transactions_text}
        Do all of these look familiar to you?

  utter_ask_confirm_lock_card:
    - text: |
        Since your card was reported lost, I can lock it now so it cannot be used
        while we send a replacement. Should I lock it? Please say yes to lock or no
        to keep it active.

  utter_ask_confirm_digital_wallet:
    - text: |
        Would you like to add the replacement card to a digital wallet — Apple Pay,
        Google Pay, or Samsung Pay — so you can use it as soon as it is issued? If
        not, I can just ship the physical card.

  utter_ask_wallet_provider:
    - text: |
        Which digital wallet should I use — Apple Pay, Google Pay, or Samsung Pay?

  utter_ask_shipping:
    - text: |
        How would you like the new card shipped — Rush delivery in 1 to 2 business
        days, or Standard in 5 to 7 business days?

  utter_ask_shipping_standard_only:
    - text: |
        Rush shipping is not available for this card. Standard delivery in 5 to 7
        business days is available. Is standard shipping okay?

  utter_confirm_order:
    - text: |
        Here's a summary of your replacement order:
        Card: {session.card_disambiguation.selected_card_label}
        Reason: {session.card_replace.replacement_reason}
        Shipping: {session.card_replace.shipping_type}
        Shall I go ahead and place the order? Please say yes to place it or no to cancel.

  utter_card_replace_completed:
    - text: |
        All set. Your replacement card order has been submitted.

  utter_card_replace_cancelled:
    - text: Okay, I will not place the replacement order. Let me know if you want to continue later.
