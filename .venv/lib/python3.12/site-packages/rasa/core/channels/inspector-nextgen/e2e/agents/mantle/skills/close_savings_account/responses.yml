responses:
  utter_recording_notice:
    - text: |
        This call may be recorded for quality and training purposes.
  utter_ask_account_name:
    - text: |
        Which savings account would you like to close? Please share the
        account name as it appears with us.
  utter_ask_close_reason:
    - text: |
        Why are you closing this savings account — consolidating accounts,
        relocating, or an early withdrawal?
  utter_early_withdrawal_warning:
    - text: |
        Closing this savings account before the promotional period ends may
        forfeit accrued bonus interest. You can still proceed if you want to
        close it now.
  utter_ask_close_confirmation:
    - text: |
        Permanently close the savings account "{account_name}"? This cannot be
        undone.
  utter_close_cancelled:
    - text: |
        Alright, I won't close the savings account "{account_name}".
  utter_account_closed:
    - text: |
        Done — the savings account "{session.close_savings_account.account_name}"
        is permanently closed.
  utter_account_close_failed:
    - text: |
        I couldn't close the savings account right now. Please try again in a
        few minutes or contact customer support for help.
