responses:
  utter_confirm_travel_notice:
    - text: |
        Here is your travel notice:
        Card: {session.card_disambiguation.selected_card_label}
        Destination: {session.travel_notice.destination}
        Dates: {session.travel_notice.travel_dates}
        Shall I set this travel notice? Please say yes to confirm or no to cancel.
  utter_high_risk_destination:
    - text: |
        Heads up: card acceptance at your destination can be limited, and some
        merchants may decline foreign cards. Consider carrying a backup payment
        method just in case.
  utter_travel_notice_submitted:
    - text: |
        Done — your travel notice is set for {session.travel_notice.destination}
        ({session.travel_notice.travel_dates}). Purchases there will not be
        flagged as suspicious. Have a great trip!
  utter_travel_notice_cancelled:
    - text: Okay, I have not set a travel notice. Anything else I can help with?
