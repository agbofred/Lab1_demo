# External integrations for your Mantle agent.
# The orchestrator names its group in agent.yml (`orchestrator.model_group`).

model_groups:
  - id: main_model
    models:
      - provider: openai
        model: gpt-5.2
        api_key: ${OPENAI_API_KEY}

channels:
  rest:
    enabled: true
  inspector:
    enabled: true

