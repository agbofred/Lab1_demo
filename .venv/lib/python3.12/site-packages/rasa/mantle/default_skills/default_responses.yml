# Packaged system default responses. Builders override any entry by declaring
# the same response name in their own responses.yml.
responses:
  utter_set_memory_button_skipped:
    - text: "That selection '{button_title}' is no longer available or an invalid value. Please choose an available option or type your message."
  utter_incoming_message_rejected:
    - text: "I'm sorry, but I can't process that message. Please try again."
  utter_outgoing_text_rejected:
    - text: "I'm sorry, but I can't provide that response. Please try again."
  utter_precondition_unmet:
    - text: "I'm sorry, I wasn't able to continue with that request."
  utter_hangup_goodbye:
    - text: "Thanks for calling. Goodbye."
  utter_model_request_hook_error:
    - text: "I'm sorry, but something went wrong. Please try again."
  utter_tool_call_hook_error:
    - text: "I'm sorry, but something went wrong. Please try again."
  utter_model_call_error:
    - text: "I'm sorry, but something went wrong. Please try again."
